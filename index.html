<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Family Bookshelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
[hidden]{display:none!important} img{max-width:100%} body{margin:0}

/* Layout: a library shelf. Shelf buttons look like book spines; covers sit on wooden-ledge rows; a pop-up "library card" shows details. */
:root{
  --sky:#e6f1fa; --paper:#ffffff; --ink:#1c2a48; --soft:#51607e; --line:#c9d8ea;
  --sun:#ffc23d; --coral:#ef5d4a; --leaf:#2a9a64; --plum:#7b4fb3; --sea:#1f7fb8; --ledge:#c98b4f;
  --chip:#eef4fb; --shadow:rgba(28,42,72,.18);
  --display:"Grandstander", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#101b30; --paper:#18253f; --ink:#eef4ff; --soft:#a9b8d3; --line:#2c3d5f;
  --sun:#ffcf5c; --coral:#ff7a68; --leaf:#4cc28a; --plum:#a985e0; --sea:#5bb2e6; --ledge:#8a5d33;
  --chip:#20304f; --shadow:rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sky:#101b30; --paper:#18253f; --ink:#eef4ff; --soft:#a9b8d3; --line:#2c3d5f;
  --sun:#ffcf5c; --coral:#ff7a68; --leaf:#4cc28a; --plum:#a985e0; --sea:#5bb2e6; --ledge:#8a5d33;
  --chip:#20304f; --shadow:rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:78rem;margin:0 auto;padding-block:1.5rem 4rem;display:flex;flex-direction:column;gap:1.4rem}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sea);outline-offset:3px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem}
.brand{display:flex;flex-direction:column;gap:.35rem;min-width:0}
h1{font-size:clamp(2.1rem,6vw,3.4rem);font-weight:800;letter-spacing:-.01em}
h1 .sun{color:var(--coral)}
.sub{color:var(--soft);font-size:1rem}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;flex:1 1 22rem;justify-content:flex-end}
.search{flex:1 1 16rem;max-width:26rem;position:relative}
.search input{width:100%;font:inherit;font-size:1.05rem;padding:.75rem 1rem .75rem 2.6rem;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.search svg{position:absolute;left:.95rem;top:50%;transform:translateY(-50%);width:1.1rem;height:1.1rem;color:var(--soft)}
.surprise{font-family:var(--display);font-weight:800;font-size:1.05rem;background:var(--sun);color:#3a2a00;border:0;border-radius:999px;padding:.75rem 1.2rem;cursor:pointer;box-shadow:0 3px 0 #c98f12}
.surprise:active{transform:translateY(2px);box-shadow:0 1px 0 #c98f12}

/* shelf spines */
.spines{display:flex;gap:.45rem;overflow-x:auto;padding:.4rem .1rem .9rem;border-bottom:8px solid var(--ledge);border-radius:0 0 4px 4px;scrollbar-width:thin}
.spine{flex:0 0 auto;min-height:5.2rem;width:4.4rem;border:0;border-radius:6px 6px 2px 2px;cursor:pointer;color:#fff;
  font-family:var(--display);font-weight:800;font-size:.86rem;line-height:1.05;padding:.5rem .3rem;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;
  box-shadow:inset -5px 0 0 rgba(0,0,0,.14), inset 0 6px 0 rgba(255,255,255,.18);transition:transform .15s}
.spine .n{font-family:var(--body);font-weight:700;font-size:.75rem;opacity:.9}
.spine[aria-pressed="true"]{transform:translateY(-.55rem);box-shadow:inset -5px 0 0 rgba(0,0,0,.14), inset 0 6px 0 rgba(255,255,255,.18), 0 6px 0 var(--sun)}
.spine:nth-child(6n+1){background:#d6533f}.spine:nth-child(6n+2){background:#2b7fb5}.spine:nth-child(6n+3){background:#2f9a62}
.spine:nth-child(6n+4){background:#8452bd}.spine:nth-child(6n+5){background:#c27c12}.spine:nth-child(6n+6){background:#1f8a8a}
@media (prefers-reduced-motion: reduce){.spine{transition:none}}

.filters{display:flex;flex-direction:column;gap:.65rem}
.row{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
.row .lab{font-family:var(--display);font-weight:600;color:var(--soft);font-size:.95rem;margin-right:.2rem}
.chip{border:2px solid var(--line);background:var(--chip);border-radius:999px;padding:.3rem .8rem;font-size:.95rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.lvl{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:.35rem .8rem;cursor:pointer;display:flex;gap:.45rem;align-items:center;font-size:.95rem}
.lvl i{width:.8rem;height:.8rem;border-radius:50%;display:inline-block}
.lvl[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot-easy{background:var(--leaf)}.dot-just{background:var(--sea)}.dot-big{background:var(--plum)}
.status{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;color:var(--soft);font-size:.95rem}
.clear{border:0;background:none;color:var(--sea);text-decoration:underline;cursor:pointer;padding:0}

/* cover grid on ledges */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.2rem,1fr));gap:1.6rem 1.2rem}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2rem .9rem}}
.card{border:0;background:none;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.cov{position:relative;aspect-ratio:2/3;width:100%;max-width:100%;border-radius:4px 8px 8px 4px;overflow:visible}
.cov img,.cov .fake{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:4px 8px 8px 4px;box-shadow:0 6px 14px var(--shadow), inset 4px 0 0 rgba(0,0,0,.15);background:var(--paper)}
.card:hover .cov img,.card:hover .cov .fake{transform:translateY(-4px) rotate(-1deg);transition:transform .15s}
@media (prefers-reduced-motion: reduce){.card:hover .cov img,.card:hover .cov .fake{transform:none}}
.stack::before,.stack::after{content:"";position:absolute;inset:0;border-radius:4px 8px 8px 4px;background:var(--paper);border:1px solid var(--line)}
.stack::before{transform:translate(8px,-6px) rotate(3deg)}.stack::after{transform:translate(4px,-3px) rotate(1.5deg)}
.badge{position:absolute;right:-.4rem;top:-.5rem;z-index:2;background:var(--coral);color:#fff;font-family:var(--display);font-weight:800;font-size:.85rem;border-radius:999px;padding:.15rem .55rem;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.fake{display:flex;flex-direction:column;justify-content:center;gap:.4rem;padding:.8rem;color:#fff;font-family:var(--display);font-weight:800;font-size:1rem;line-height:1.1;text-align:center}
.card .t{font-family:var(--display);font-weight:600;font-size:1.02rem;line-height:1.15}
.card .a{color:var(--soft);font-size:.86rem}
.card .meta{display:flex;gap:.35rem;align-items:center;font-size:.8rem;color:var(--soft)}
.card .meta i{width:.65rem;height:.65rem;border-radius:50%;display:inline-block;flex:none}
.empty{padding:2rem;text-align:center;color:var(--soft);font-size:1.1rem;grid-column:1/-1}

/* library-card dialog */
dialog{border:0;padding:0;background:transparent;max-width:min(46rem,calc(100vw - 32px));width:100%;max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(16,27,48,.55)}
.libcard{background:var(--paper);color:var(--ink);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:auto;max-height:calc(100dvh - 32px);
  background-image:repeating-linear-gradient(to bottom, transparent 0 2.05rem, var(--line) 2.05rem calc(2.05rem + 1px));background-position:0 6.5rem;background-repeat:repeat-y}
.libcard .top{display:grid;grid-template-columns:9rem minmax(0,1fr);gap:1.2rem;padding:1.3rem 1.3rem .6rem;background:var(--paper);border-top:10px solid var(--coral)}
@media (max-width:480px){.libcard .top{grid-template-columns:6.5rem minmax(0,1fr);gap:.9rem;padding:1rem}}
.libcard .cov{width:100%}
.libcard h2{font-size:1.6rem}
.libcard .by{color:var(--soft);margin:.2rem 0 .5rem}
.libcard .body{padding:0 1.3rem 1.3rem;display:flex;flex-direction:column;gap:.9rem}
.libcard p{margin:0;max-width:62ch}
.where{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;font-size:.9rem}
.where b{font-family:var(--display);font-weight:600}
.where span{background:var(--chip);border:1px dashed var(--soft);border-radius:6px;padding:.1rem .45rem}
.note{border-left:5px solid var(--sun);background:var(--chip);padding:.6rem .8rem;border-radius:6px;font-size:.95rem}
.note b{font-family:var(--display)}
.tags{display:flex;flex-wrap:wrap;gap:.35rem}
.tags button{font-size:.85rem;padding:.2rem .65rem}
.close{position:sticky;top:.6rem;float:right;margin:.6rem .6rem 0 0;z-index:3;border:0;background:var(--ink);color:var(--paper);border-radius:999px;width:2.4rem;height:2.4rem;font-size:1.3rem;cursor:pointer;line-height:1}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55rem}
.list li{display:grid;grid-template-columns:2.6rem minmax(0,1fr);gap:.7rem;align-items:center;background:var(--paper)}
.list .mini{aspect-ratio:2/3;width:2.6rem;border-radius:2px 4px 4px 2px;object-fit:cover;box-shadow:0 2px 5px var(--shadow);background:var(--chip)}
.list .mini.fake{font-size:.5rem;padding:.15rem;position:static}
.list .bt{font-weight:700}.list .bs{color:var(--soft);font-size:.9rem}
footer{color:var(--soft);font-size:.9rem;text-align:center}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="brand">
      <h1>Our Family <span class="sun">Bookshelf</span></h1>
      <div class="sub" id="sub">Every book on our e-readers. Tap a cover to see what it's about.</div>
    </div>
    <div class="actions">
      <label class="search"><span class="sr" hidden>Search</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Find a book, author or word…" autocomplete="off" aria-label="Search books">
      </label>
      <button class="surprise" id="surprise" type="button">Surprise me!</button>
    </div>
  </header>

  <nav class="spines" id="spines" aria-label="Shelves"></nav>

  <div class="filters">
    <div class="row" id="levels"><span class="lab">How long?</span></div>
    <div class="row" id="tags"><span class="lab">I want…</span></div>
  </div>

  <div class="status"><span id="count"></span><button class="clear" id="clear" type="button" hidden>Show everything again</button></div>
  <main class="grid" id="grid"></main>
  <footer>On the reader, open the folder shown on each book's card. Books in "For Later" are for older readers, 10 and up.</footer>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle"><div class="libcard" id="lc"></div></dialog>

o.", "tags": ["Twins", "History"], "lvl": "easy", "note": "Written in 1915 by someone who wasn't Mexican, so it's old-fashioned. Good to read together and talk about."}, {"id": "luis-coloma-rat-n-p-rez", "file": "Roots - Mexico and Español/Luis Coloma - Ratón Pérez.epub", "folder": "Roots - Mexico and Español", "shelf": "México & Español", "cover": "covers/luis-coloma-rat-n-p-rez.jpg", "title": "Ratón Pérez", "author": "Luis Coloma", "s": "The story of Ratoncito Pérez, the little mouse who collects children's teeth. In Spanish.", "tags": ["Español", "Animals", "Magic"], "lvl": "just", "note": null}, {"id": "nathaniel-hawthorne-cuando-la-tierra-era-ni-a-mitos-griegos", "file": "Roots - Mexico and Español/Nathaniel Hawthorne - Cuando la tierra era niña (Mitos griegos).epub", "folder": "Roots - Mexico and Español", "shelf": "México & Español", "cover": "covers/nathaniel-hawthorne-cuando-la-tierra-era-ni-a-mitos-griegos.jpg", "title": "Cuando la tierra era niña", "author": "Nathaniel Hawthorne", "s": "Greek myths for kids, like Pandora's box and King Midas. In Spanish.", "tags": ["Español", "Myths"], "lvl": "just", "note": null}, {"id": "rudyard-kipling-el-libro-de-las-tierras-v-rgenes", "file": "Roots - Mexico and Español/Rudyard Kipling - El libro de las tierras vírgenes.epub", "folder": "Roots - Mexico and Español", "shelf": "México & Español", "cover": "covers/rudyard-kipling-el-libro-de-las-tierras-v-rgenes.jpg", "title": "El libro de las tierras vírgenes", "author": "Rudyard Kipling", "s": "The Jungle Book, about Mowgli and the wolves. In Spanish.", "tags": ["Español", "Animals", "Adventure"], "lvl": "just", "note": null}], "series": {"tom-swift": {"name": "Tom Swift", "lvl": "just", "tags": ["Adventure", "Inventions", "Series"], "blurb": "Tom Swift is a teenage inventor who builds motorcycles, airships, submarines and a giant searchlight, then uses them to chase crooks and find lost treasure. Short chapters and a cliffhanger in almost every one.", "note": "Written over 100 years ago. It has some old-fashioned ideas and a few unkind stereotypes about people, so it's a good one to read with a grown-up. The helper Eradicate Sampson is drawn as a racist caricature."}, "bobbsey": {"name": "The Bobbsey Twins", "lvl": "easy", "tags": ["Twins", "Funny", "Series"], "blurb": "Two sets of twins, Nan and Bert and little Flossie and Freddie, have small adventures at home, at school, at the seaside and on trips. Gentle, quick and cozy.", "note": "Written over 100 years ago. It has some old-fashioned ideas and a few unkind stereotypes about people, so it's a good one to read with a grown-up. The family's servants Dinah and Sam are drawn as racist caricatures."}, "dolittle": {"name": "Doctor Dolittle", "lvl": "just", "tags": ["Animals", "Adventure", "Funny", "Series"], "blurb": "Doctor Dolittle learns to talk to animals from his parrot Polynesia, and then his patients are all animals: monkeys, ducks, a pig named Gub-Gub, and a two-headed pushmi-pullyu.", "note": "The first book has chapters about an African prince that are racist. Later editions rewrote them. Read with a grown-up."}, "nancy": {"name": "Nancy Drew", "lvl": "just", "tags": ["Mystery", "Girl Hero", "Series"], "blurb": "Nancy Drew is a smart, brave teenager who solves mysteries in her small town: hidden staircases, missing wills, secret passwords and spooky clocks.", "note": "These are the original 1930s-1950s texts. Books 1-4 have some dated stereotypes (especially The Hidden Staircase). Books 6 and up are scanned copies, so there are a few typos."}, "hardy": {"name": "The Hardy Boys", "lvl": "just", "tags": ["Mystery", "Adventure", "Series"], "blurb": "Brothers Frank and Joe Hardy help their detective dad by cracking cases of their own: stolen treasure, smugglers' caves and a mystery at the airport.", "note": "Written over 100 years ago. It has some old-fashioned ideas and a few unkind stereotypes about people, so it's a good one to read with a grown-up."}, "oz": {"name": "The Oz Books", "lvl": "just", "tags": ["Magic", "Adventure", "Series", "Girl Hero"], "blurb": "It starts with Dorothy, a cyclone and the yellow brick road, then keeps going for 29 books full of talking animals, princesses, wizards and very strange creatures. Books 1-14 are by L. Frank Baum; 15-33 were written after he died by Ruth Plumly Thompson."}, "baum-more": {"name": "More Magic by L. Frank Baum", "lvl": "just", "tags": ["Magic", "Adventure"], "blurb": "Baum's other fantasy books. Start with The Sea Fairies and Sky Island: Trot and Cap'n Bill have these adventures before they ever reach Oz."}, "lang": {"name": "Andrew Lang's Fairy Books", "lvl": "just", "tags": ["Fairy Tales", "Magic", "Series"], "blurb": "Twelve books of fairy tales from all over the world, each named for a color. These are the stories The Land of Stories borrows from: Cinderella, Rapunzel, Aladdin, Jack and the Beanstalk and hundreds more. Each tale is short, so dip in anywhere."}, "anne": {"name": "Anne of Green Gables", "lvl": "big", "tags": ["Girl Hero", "Friends & Family", "Series"], "blurb": "Anne Shirley is a chatty, dramatic orphan with red hair and a huge imagination. Book 1 is wonderful at 9 or 10; the later books follow Anne as a grown-up and her children."}, "nesbit": {"name": "E. Nesbit", "lvl": "just", "tags": ["Magic", "Funny", "Friends & Family"], "blurb": "Brothers and sisters, magic that goes wrong, and lots of laughing. E. Nesbit wrote these over 100 years ago and they still feel fresh."}, "pooh": {"name": "Winnie-the-Pooh", "lvl": "easy", "tags": ["Animals", "Funny", "Read Together"], "blurb": "Pooh Bear, Piglet, Eeyore and Christopher Robin in the Hundred Acre Wood, plus A. A. Milne's two books of poems."}, "burgess": {"name": "Thornton Burgess Nature Stories", "lvl": "easy", "tags": ["Animals", "Nature", "Real Science"], "blurb": "Peter Rabbit, Jimmy Skunk and Reddy Fox live in the Green Meadows. The stories are fun, and you learn real facts about animals and birds along the way."}}}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const BOOKS = DATA.books, SERIES = DATA.series;
const SHELVES = ['Fantasy','Mystery','Adventure','Oz','Fairy Tales & Myths','Classics','True Stories & Science','Bangladesh','México & Español','For Later (10+)'];
const LEVELS = {easy:{label:'Easy read', cls:'dot-easy'}, just:{label:'Just right', cls:'dot-just'}, big:{label:'Big read (10+)', cls:'dot-big'}};
const TAGS = ['Magic','Mystery','Animals','Funny','Adventure','Girl Hero','Twins','Dragons','Myths','Fairy Tales','Inventions','Friends & Family','Real People','Real Science','Nature','History','Poems','Read Together','Español','Bangla','Learn a Language'];
const FAKE_COLORS = ['#d6533f','#2b7fb5','#2f9a62','#8452bd','#c27c12','#1f8a8a'];
const state = {shelf:null, level:null, tags:new Set(), q:''};
try { const s = JSON.parse(localStorage.getItem('family-shelf') || '{}'); if (s.shelf) state.shelf = s.shelf; if (s.level) state.level = s.level; } catch(e) {}
const save = () => { try { localStorage.setItem('family-shelf', JSON.stringify({shelf:state.shelf, level:state.level})); } catch(e) {} };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash = s => [...s].reduce((h,c)=>(h*31 + c.charCodeAt(0))|0, 7);

// Group series into one entry each
function entries(){
  const out = [], seen = {};
  for (const b of BOOKS){
    if (b.series){
      if (!seen[b.series]){ seen[b.series] = {kind:'series', key:b.series, ...SERIES[b.series], books:[], shelf:b.shelf, folder:b.folder}; out.push(seen[b.series]); }
      seen[b.series].books.push(b);
    } else out.push({kind:'book', ...b});
  }
  for (const k in seen){
    const s = seen[k]; s.books.sort((a,b)=>(a.num??999)-(b.num??999) || a.title.localeCompare(b.title));
    s.cover = (s.books.find(b=>b.cover)||{}).cover; s.title = s.name; s.author = [...new Set(s.books.map(b=>b.author).filter(Boolean))].slice(0,2).join(' & ');
    s.folders = [...new Set(s.books.map(b=>b.folder))];
  }
  return out;
}
const ALL = entries();

function coverHTML(e, cls=''){
  if (e.cover) return `<img src="${esc(e.cover)}" alt="" loading="lazy" class="${cls}">`;
  const c = FAKE_COLORS[Math.abs(hash(e.title)) % FAKE_COLORS.length];
  return `<div class="fake ${cls}" style="background:${c}"><span>${esc(e.title)}</span><small style="font-family:var(--body);font-weight:400;font-size:.75em">${esc(e.author||'')}</small></div>`;
}
const text = e => (e.title+' '+(e.author||'')+' '+(e.s||e.blurb||'')+' '+(e.tags||[]).join(' ')+' '+(e.books||[]).map(b=>b.title+' '+(b.s||'')+' '+(b.sub||'')).join(' ')).toLowerCase();

function matches(e){
  if (state.shelf && e.shelf !== state.shelf) return false;
  if (state.level && e.lvl !== state.level) return false;
  for (const t of state.tags) if (!(e.tags||[]).includes(t)) return false;
  if (state.q && !text(e).includes(state.q)) return false;
  return true;
}

function renderNav(){
  const sp = document.getElementById('spines'); sp.replaceChildren();
  const mk = (label, val, n) => { const b = document.createElement('button'); b.type='button'; b.className='spine'; b.setAttribute('aria-pressed', String(state.shelf===val));
    b.innerHTML = `<span>${esc(label)}</span><span class="n">${n}</span>`; b.onclick = () => { state.shelf = state.shelf===val ? null : val; save(); render(); }; return b; };
  sp.append(mk('All books', null, BOOKS.length));
  SHELVES.forEach(s => sp.append(mk(s, s, BOOKS.filter(b=>b.shelf===s).length)));
  const lv = document.getElementById('levels'); lv.querySelectorAll('button').forEach(x=>x.remove());
  Object.entries(LEVELS).forEach(([k,v]) => { const b = document.createElement('button'); b.type='button'; b.className='lvl'; b.setAttribute('aria-pressed', String(state.level===k));
    b.innerHTML = `<i class="${v.cls}"></i>${v.label}`; b.onclick = () => { state.level = state.level===k ? null : k; save(); render(); }; lv.append(b); });
  const tg = document.getElementById('tags'); tg.querySelectorAll('button').forEach(x=>x.remove());
  TAGS.forEach(t => { const b = document.createElement('button'); b.type='button'; b.className='chip'; b.setAttribute('aria-pressed', String(state.tags.has(t)));
    b.textContent = t; b.onclick = () => { state.tags.has(t) ? state.tags.delete(t) : state.tags.add(t); render(); }; tg.append(b); });
}

function render(){
  renderNav();
  const list = ALL.filter(matches);
  const g = document.getElementById('grid'); g.replaceChildren();
  for (const e of list){
    const b = document.createElement('button'); b.type='button'; b.className='card';
    const lv = LEVELS[e.lvl] || LEVELS.just;
    b.innerHTML = `<div class="cov ${e.kind==='series'?'stack':''}">${coverHTML(e)}${e.kind==='series'?`<span class="badge">${e.books.length} books</span>`:''}</div>
      <div class="t">${esc(e.title)}</div><div class="a">${esc(e.author||'')}</div>
      <div class="meta"><i class="${lv.cls}"></i>${lv.label}</div>`;
    b.setAttribute('aria-label', `${e.title}${e.kind==='series'?`, ${e.books.length} books`:''}`);
    b.onclick = () => open(e); g.append(b);
  }
  if (!list.length){ const p = document.createElement('p'); p.className='empty'; p.textContent = "No books match all of those. Try turning off a button or two."; g.append(p); }
  const n = list.reduce((s,e)=>s+(e.kind==='series'?e.books.length:1),0);
  document.getElementById('count').textContent = `Showing ${n} of ${BOOKS.length} books`;
  document.getElementById('clear').hidden = !(state.shelf||state.level||state.tags.size||state.q);
}

function whereHTML(folders){
  return folders.map(f => `<div class="where"><b>On the reader:</b>${f.split(' › ').map(p=>`<span>${esc(p)}</span>`).join(' › ')}</div>`).join('');
}
function open(e){
  const lc = document.getElementById('lc'); const lv = LEVELS[e.lvl] || LEVELS.just;
  const tags = (e.tags||[]).filter(t=>TAGS.includes(t)).map(t=>`<button type="button" class="chip" data-tag="${esc(t)}">${esc(t)}</button>`).join('');
  let body = '';
  if (e.kind==='series'){
    body = `<p>${esc(e.blurb)}</p>${whereHTML(e.folders.slice(0,2))}
      ${e.note?`<div class="note"><b>For grown-ups:</b> ${esc(e.note)}</div>`:''}
      <h3>The books</h3><ol class="list">${e.books.map(b=>`<li>${b.cover?`<img class="mini" src="${esc(b.cover)}" alt="" loading="lazy">`:`<div class="mini fake" style="background:${FAKE_COLORS[Math.abs(hash(b.title))%6]}"></div>`}
        <div><div class="bt">${b.num?`${b.num}. `:''}${esc(b.title)}</div>${b.sub?`<div class="bs">${esc(b.sub)}</div>`:''}${b.s?`<div class="bs">${esc(b.s)}</div>`:''}</div></li>`).join('')}</ol>`;
  } else {
    body = `<p>${esc(e.s || 'A book on your reader.')}</p>${whereHTML([e.folder])}
      ${e.note?`<div class="note"><b>For grown-ups:</b> ${esc(e.note)}</div>`:''}`;
  }
  lc.innerHTML = `<button class="close" type="button" aria-label="Close">×</button>
    <div class="top"><div class="cov ${e.kind==='series'?'stack':''}">${coverHTML(e)}</div>
      <div style="min-width:0"><h2 id="dlgTitle">${esc(e.title)}</h2><div class="by">${esc(e.author||'')}</div>
      <div class="meta" style="display:flex;gap:.4rem;align-items:center;margin-bottom:.6rem"><i class="${lv.cls}" style="width:.8rem;height:.8rem;border-radius:50%;display:inline-block"></i>${lv.label}</div>
      <div class="tags">${tags}</div></div></div>
    <div class="body">${body}</div>`;
  lc.querySelector('.close').onclick = () => dlg.close();
  lc.querySelectorAll('[data-tag]').forEach(b => b.onclick = () => { state.tags = new Set([b.dataset.tag]); state.shelf = null; dlg.close(); render(); document.getElementById('grid').scrollIntoView({behavior:'smooth', block:'start'}); });
  dlg.showModal(); lc.scrollTop = 0;
}
const dlg = document.getElementById('dlg');
dlg.addEventListener('click', ev => { if (ev.target === dlg) dlg.close(); });

document.getElementById('q').addEventListener('input', ev => { state.q = ev.target.value.trim().toLowerCase(); render(); });
document.getElementById('clear').onclick = () => { state.shelf=null; state.level=null; state.tags.clear(); state.q=''; document.getElementById('q').value=''; save(); render(); };
document.getElementById('surprise').onclick = () => {
  const pool = ALL.filter(e => e.lvl !== 'big' && matches(e)); const from = pool.length ? pool : ALL.filter(e=>e.lvl!=='big');
  open(from[Math.floor(Math.random()*from.length)]);
};
render();
</script>

</body>
</html>
